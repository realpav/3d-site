<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ХРУСТ • ПАНК • LORENZ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ----- БАЗА ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0a;
            color: #f5f0e8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ----- ФОН: АНИМИРОВАННЫЙ ГРАДИЕНТ (как в прошлом хидере) ----- */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 50%, #ff00cc 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, #00ff88 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, #ffcc00 0%, transparent 50%),
                #0a0a0a;
            background-blend-mode: screen;
            animation: gradientMove 12s ease-in-out infinite alternate;
        }

        @keyframes gradientMove {
            0% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1.2) rotate(3deg);
            }
        }

        /* Шумовая текстура */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
            pointer-events: none;
        }

        /* ----- ОСНОВНОЙ КОНТЕЙНЕР ----- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px 40px;
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        /* ----- ГЛАВНЫЙ БЛОК ----- */
        .hero {
            text-align: center;
            max-width: 900px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 0, 204, 0.15);
            color: #ff00cc;
            padding: 8px 24px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 0, 204, 0.2);
            animation: pulseBadge 2s ease-in-out infinite;
            margin-bottom: 30px;
        }

        @keyframes pulseBadge {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 204, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 0, 204, 0.4);
            }
        }

        .hero h1 {
            font-size: 80px;
            font-weight: 800;
            line-height: 1.05;
            text-transform: uppercase;
            letter-spacing: -3px;
            color: #fff;
        }

        .hero h1 .line1 {
            display: block;
        }

        .hero h1 .line2 {
            background: linear-gradient(135deg, #ff00cc, #ffcc00, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: textShift 3s ease-in-out infinite;
        }

        @keyframes textShift {
            0%,
            100% {
                transform: skewX(0deg) scale(1);
            }
            50% {
                transform: skewX(-3deg) scale(1.02);
            }
        }

        .hero h1 .line3 {
            display: block;
            color: #fff;
            position: relative;
        }

        .hero h1 .line3::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 10px;
            background: #ff00cc;
            opacity: 0.2;
            transform: rotate(-1deg);
        }

        .hero p {
            font-size: 20px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.6);
            max-width: 580px;
            margin: 24px auto 36px;
            font-weight: 400;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 44px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Space Grotesk', sans-serif;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #ff00cc;
            color: #0a0a0a;
            box-shadow: 0 0 40px rgba(255, 0, 204, 0.2);
        }

        .btn-primary:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 70px rgba(255, 0, 204, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
        }

        /* ----- ФУТЕР ----- */
        .footer {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.15);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #ff00cc;
        }

        .footer .punk {
            color: rgba(255, 0, 204, 0.3);
        }

        /* ----- АДАПТИВ ----- */
        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
                min-height: 80vh;
            }
            .hero h1 {
                font-size: 44px;
                letter-spacing: -1px;
            }
            .hero p {
                font-size: 17px;
                padding: 0 10px;
            }
            .btn {
                padding: 14px 28px;
                font-size: 13px;
            }
            .badge {
                font-size: 11px;
                padding: 6px 16px;
            }
            .footer {
                flex-direction: column;
                gap: 8px;
                padding: 16px 20px 30px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 32px;
            }
            .hero p {
                font-size: 15px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 11px;
                width: 100%;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .btn-group .btn {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ФОН ===== -->
    <div class="bg"></div>
    <div class="noise"></div>

    <!-- ===== ОСНОВНОЙ БЛОК ===== -->
    <div class="container">
        <div class="hero">
            <div class="badge">⚡ ХРУСТ КАК ИСКУССТВО</div>
            <h1>
                <span class="line1">Ломай</span>
                <span class="line2">стереотипы</span>
                <span class="line3">хрусти</span>
            </h1>
            <p>
                Мы не делаем чипсы. Мы создаём хруст, который ломает шаблоны.
                Натуральный картофель + бунтарский подход = твой идеальный вкус.
            </p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary">Взорвать вкус</a>
                <a href="#" class="btn btn-secondary">Узнать тайну</a>
            </div>
        </div>
    </div>

    <!-- ===== ФУТЕР ===== -->
    <div class="footer">
        <span>© 2026 <span class="punk">✦</span> Клуб бунтарей Lorenz</span>
        <span>
            <a href="#">Instagram</a> •
            <a href="#">Telegram</a> •
            <a href="#">ВКонтакте</a>
        </span>
    </div>

</body>
</html>
