<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ХРУСТ • ПАНК • LORENZ</title>

    <!-- Шрифты: брутальный + гранж -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* ----- СБРОС И БАЗА ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0a;
            color: #f5f0e8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ----- ФОН: АНИМИРОВАННЫЙ ГРАДИЕНТ + ШУМ ----- */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 50%, #ff00cc 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, #00ff88 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, #ffcc00 0%, transparent 50%),
                #0a0a0a;
            background-blend-mode: screen;
            animation: gradientMove 12s ease-in-out infinite alternate;
        }

        @keyframes gradientMove {
            0% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1.2) rotate(3deg);
            }
        }

        /* Шумовая текстура (поверх градиента) */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
            pointer-events: none;
        }

        /* ----- ОСНОВНОЙ КОНТЕЙНЕР ----- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 40px 60px;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* ----- ЛЕВАЯ ЧАСТЬ: ТЕКСТ ----- */
        .text-block {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 0, 204, 0.2);
            color: #ff00cc;
            padding: 6px 20px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: fit-content;
            border: 1px solid rgba(255, 0, 204, 0.3);
            animation: pulseBadge 2s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 204, 0.2);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 0, 204, 0.5);
            }
        }

        .title {
            font-size: 64px;
            font-weight: 700;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .title .line1 {
            color: #fff;
        }
        .title .line2 {
            background: linear-gradient(135deg, #ff00cc, #ffcc00, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: textShift 4s ease-in-out infinite;
        }

        @keyframes textShift {
            0%,
            100% {
                transform: skewX(0deg);
            }
            50% {
                transform: skewX(-4deg);
            }
        }

        .title .line3 {
            color: #fff;
            position: relative;
            display: inline-block;
        }

        .title .line3::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 100%;
            height: 8px;
            background: #ff00cc;
            opacity: 0.3;
            transform: rotate(-2deg);
        }

        .desc {
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
            max-width: 480px;
            font-weight: 400;
            border-left: 3px solid #ff00cc;
            padding-left: 20px;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 0;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Space Grotesk', sans-serif;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #ff00cc;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 60px rgba(255, 0, 204, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }

        /* ----- ПРАВАЯ ЧАСТЬ: 3D + ИНТЕРАКТИВ ----- */
        .model-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .model-container {
            width: 100%;
            max-width: 550px;
            aspect-ratio: 1/1;
            position: relative;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 80px rgba(255, 0, 204, 0.05);
            overflow: hidden;
        }

        .model-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* Эффект "свечения" вокруг 3D-контейнера */
        .model-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 22px;
            background: conic-gradient(from 0deg, #ff00cc, #ffcc00, #00ff88, #ff00cc);
            z-index: -1;
            opacity: 0.3;
            animation: rotateBorder 6s linear infinite;
        }

        @keyframes rotateBorder {
            to {
                transform: rotate(360deg);
            }
        }

        /* Индикатор загрузки (стильный) */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #0a0a0a;
            border-radius: 20px;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 2px solid rgba(255, 0, 204, 0.1);
            border-top-color: #ff00cc;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .loading-text span {
            color: #ff00cc;
            font-weight: 700;
        }

        /* ----- ФУТЕР (панковский) ----- */
        .footer {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #ff00cc;
        }

        .footer .punk {
            color: rgba(255, 0, 204, 0.3);
        }

        /* ----- АДАПТИВ ----- */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                padding: 30px 20px 40px;
                text-align: center;
            }
            .text-block {
                align-items: center;
            }
            .desc {
                max-width: 100%;
                text-align: center;
                border-left: none;
                padding-left: 0;
            }
            .btn-group {
                justify-content: center;
            }
            .badge {
                margin: 0 auto;
            }
            .title {
                font-size: 48px;
            }
            .model-container {
                max-width: 400px;
                margin: 0 auto;
            }
            .footer {
                flex-direction: column;
                gap: 8px;
                padding: 16px 20px;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 32px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 12px;
            }
            .model-container {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- ФОН -->
    <div class="bg"></div>
    <div class="noise"></div>

    <!-- ===== ОСНОВНАЯ СЕТКА ===== -->
    <div class="container">

        <!-- ЛЕВАЯ ЧАСТЬ: ТЕКСТ -->
        <div class="text-block">
            <span class="badge">⚡ ХРУСТ КАК ИСКУССТВО</span>
            <h1 class="title">
                <span class="line1">Ломай</span><br />
                <span class="line2">стереотипы</span><br />
                <span class="line3">хрусти</span>
            </h1>
            <p class="desc">
                Мы не делаем чипсы. Мы создаём хруст, который ломает шаблоны.
                Натуральный картофель + бунтарский подход = твой идеальный вкус.
            </p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary">Взорвать вкус</a>
                <a href="#" class="btn btn-secondary">Узнать тайну</a>
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ: 3D -->
        <div class="model-wrapper">
            <div class="model-container" id="model-container">
                <!-- Индикатор загрузки -->
                <div class="loading-overlay" id="loading-overlay">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Загрузка <span id="progress-text">0%</span></div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== ФУТЕР ===== -->
    <div class="footer">
        <span>© 2026 <span class="punk">✦</span> Клуб бунтарей Lorenz</span>
        <span>
            <a href="#">Instagram</a> •
            <a href="#">Telegram</a> •
            <a href="#">ВКонтакте</a>
        </span>
    </div>

    <!-- ===== THREE.JS ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Контейнер ---
        const container = document.getElementById('model-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const progressText = document.getElementById('progress-text');

        // --- Сцена ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        // --- Камера ---
        const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(5, 2, 7);
        camera.lookAt(0, 0, 0);

        // --- Рендерер ---
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        container.appendChild(renderer.domElement);

        // --- Управление ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        controls.minDistance = 3;
        controls.maxDistance = 15;
        controls.target.set(0, 0, 0);

        // --- Свет: неоновый + драматичный ---
        const ambient = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambient);

        const key = new THREE.DirectionalLight(0xff00cc, 2.0);
        key.position.set(3, 5, 4);
        scene.add(key);

        const fill = new THREE.DirectionalLight(0x00ff88, 1.0);
        fill.position.set(-4, 2, -2);
        scene.add(fill);

        const rim = new THREE.DirectionalLight(0xffcc00, 0.8);
        rim.position.set(-2, 1, 6);
        scene.add(rim);

        // Подсветка снизу
        const bottom = new THREE.PointLight(0xff00cc, 0.5, 10);
        bottom.position.set(0, -3, 0);
        scene.add(bottom);

        // --- Загрузка модели ---
        const loader = new GLTFLoader();
        const modelPath = 'scene.glb';

        loader.load(
            modelPath,
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(1.5, 1.5, 1.5);
                model.position.y = -0.5;
                scene.add(model);

                loadingOverlay.classList.add('hidden');
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 800);
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                progressText.textContent = percent + '%';
            },
            (error) => {
                console.error('Ошибка:', error);
                loadingOverlay.innerHTML = `
                    <div style="color:#ff00cc;font-size:32px;">✖</div>
                    <div style="color:rgba(255,255,255,0.4);font-size:14px;">3D не загрузился</div>
                    <div style="color:rgba(255,255,255,0.2);font-size:12px;">Но хруст остаётся</div>
                `;
            }
        );

        // --- Ресайз ---
        function resize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }

        window.addEventListener('resize', resize);
        setTimeout(resize, 100);

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Отключаем автовращение при взаимодействии
        renderer.domElement.addEventListener('pointerdown', () => {
            controls.autoRotate = false;
        });
        renderer.domElement.addEventListener('pointerup', () => {
            setTimeout(() => {
                controls.autoRotate = true;
            }, 3000);
        });

        // Запасной таймер для загрузки
        setTimeout(() => {
            if (!loadingOverlay.classList.contains('hidden')) {
                loadingOverlay.classList.add('hidden');
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 800);
            }
        }, 15000);
    </script>

</body>
</html>
